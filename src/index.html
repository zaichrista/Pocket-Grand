<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiny Tunes</title><meta name="description" content="Play a few notes, and send them as a QR code that unfolds into a little piano."><meta name="theme-color" content="#faf9f6"><meta property="og:type" content="website"><meta property="og:title" content="Tiny Tunes"><meta property="og:description" content="Play a few notes, and send them as a QR code that unfolds into a little piano."><meta property="og:url" content="https://zaichrista.github.io/Pocket-Grand/"><meta property="og:image" content="https://zaichrista.github.io/Pocket-Grand/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Tiny Tunes"><meta name="twitter:description" content="Play a few notes, and send them as a QR code that unfolds into a little piano."><meta name="twitter:image" content="https://zaichrista.github.io/Pocket-Grand/og.png"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23242622'/%3E%3Crect x='6' y='8' width='4' height='16' rx='1' fill='%23fffdf4'/%3E%3Crect x='11' y='8' width='4' height='16' rx='1' fill='%23fffdf4'/%3E%3Crect x='16' y='8' width='4' height='16' rx='1' fill='%23fffdf4'/%3E%3Crect x='21' y='8' width='4' height='16' rx='1' fill='%23fffdf4'/%3E%3Crect x='9' y='8' width='3' height='9' fill='%23c98a1b'/%3E%3Crect x='19' y='8' width='3' height='9' fill='%23c98a1b'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body>
<header class="brand">Tiny Tunes</header>
<main><canvas id="scene" role="button" tabindex="0" aria-label="Turn the QR code into a playable piano"></canvas></main>
<noscript><p style="position:fixed;inset:40% 20px auto;text-align:center;font:600 18px system-ui">Tiny Tunes needs JavaScript to play piano and make QR codes.</p></noscript>
<p id="note" class="note" aria-live="polite"></p>
<aside id="menu" aria-label="Make a tiny tune">
<section class="composer">
<h1>Make a tiny tune</h1>
<ol class="steps">
<li><h2><b>1</b> Play your tune</h2>
<button id="rec" class="big" type="button" aria-pressed="false"><i class="dot" aria-hidden="true"></i><span>Record</span></button>
<div class="pair"><button id="playbtn" class="mint" type="button"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg><span>Play</span></button><button id="clear" class="butter" type="button"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span>Clear</span></button></div>
<p id="status" class="status" aria-live="polite"></p></li>
<li><h2><b>2</b> Add a message <em>(optional)</em></h2>
<form class="field"><label class="sr" for="msg">Message</label><input id="msg" type="text" maxlength="80" autocomplete="off" placeholder="Happy birthday, Sam!"><small id="error" role="alert" hidden></small><div id="where" hidden><label for="home">Page address <em>(where you published this)</em></label><input id="home" type="url" inputmode="url" autocomplete="off" placeholder="https://you.github.io/tiny-tunes/"><small id="homeerr" role="alert" hidden></small></div></form></li>
<li><h2><b>3</b> Send it</h2>
<div class="pair"><button type="button" id="save" class="blush"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v10m0 0l-4-4m4 4l4-4M5 19h14"/></svg><span>Save QR</span></button><button type="button" id="share" class="ghost"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg><span>Share link</span></button></div>
<p id="sendnote" class="status"></p>
<button type="button" id="fold" class="link"></button></li>
</ol>
</section>
<section class="receiver">
<h1>You got a tiny tune</h1>
<p id="gotmsg" class="got"></p>
<button id="open" class="big" type="button"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg><span>Open &amp; play</span></button>
<button id="mine" class="ghost" type="button"><span>Make your own</span></button>
</section>
</aside>
<p id="hint" class="hint"></p><p id="announce" class="sr" aria-live="polite"></p><script src="qr.js"></script><script src="grand.js"></script></body></html>
